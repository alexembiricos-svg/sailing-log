<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Sailing Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --navy:#1a2744;--navy-l:#243258;--navy-d:#0f1929;
  --sand:#f5e6c8;--sand-l:#fdf6ea;--sand-d:#e0ceaa;
  --terra:#c1440e;--olive:#6b7c3e;--cobalt:#2e6da4;--coffee:#8B6914;
  --shadow:rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Source Sans 3',sans-serif;background:var(--navy);color:var(--sand);display:flex;flex-direction:column}

/* ── HEADER ── */
#hdr{background:var(--navy);border-bottom:1px solid var(--navy-l);padding:8px 12px 6px;flex-shrink:0;z-index:10}
#hdr-top{display:flex;align-items:center;gap:8px}
#cruise-btn{display:flex;align-items:center;gap:5px;flex:1;min-width:0;background:none;border:none;color:var(--sand);cursor:pointer;padding:0;text-align:left}
#cruise-btn span{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cruise-btn .chev{font-size:11px;opacity:.55;flex-shrink:0}
.hbtn{display:flex;align-items:center;gap:4px;background:var(--navy-l);border:1px solid rgba(245,230,200,.18);color:var(--sand);padding:6px 10px;border-radius:7px;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;white-space:nowrap}
.hbtn:active{opacity:.7}

/* ── LAYER BAR ── */
#lbar{display:flex;gap:6px;margin-top:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
#lbar::-webkit-scrollbar{display:none}
.ltog{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;border:2px solid;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;background:transparent;color:var(--sand);font-family:'Source Sans 3',sans-serif;transition:background .18s,color .18s}
.ltog .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.ltog[data-l="a"]{border-color:var(--terra)}  .ltog[data-l="a"].on{background:var(--terra);color:#fff}
.ltog[data-l="r"]{border-color:var(--olive)}  .ltog[data-l="r"].on{background:var(--olive);color:#fff}
.ltog[data-l="c"]{border-color:var(--cobalt)} .ltog[data-l="c"].on{background:var(--cobalt);color:#fff}
.ltog[data-l="h"]{border-color:var(--coffee)} .ltog[data-l="h"].on{background:var(--coffee);color:#fff}

/* ── MAP ── */
#map-wrap{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}

/* ── SEARCH ── */
#srch-wrap{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;gap:8px}
#srch{flex:1;padding:10px 14px;border-radius:8px;border:none;background:#fff;box-shadow:0 2px 10px var(--shadow);font-family:'Source Sans 3',sans-serif;font-size:14px;color:#333;outline:none}
#srch::placeholder{color:#aaa}

/* ── LAYER PICKER (fixed, centred) ── */
#lpick-bg{position:fixed;inset:0;z-index:24;display:none}
#lpick-bg.show{display:block}
#lpick{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.28);z-index:25;overflow:hidden;display:none;min-width:200px}
#lpick.show{display:block}
.lopt{display:flex;align-items:center;gap:11px;padding:13px 18px;cursor:pointer;font-size:15px;font-family:'Source Sans 3',sans-serif;color:#333;border-bottom:1px solid #f0f0f0;transition:background .12s}
.lopt:last-child{border-bottom:none}
.lopt:active{background:#f5f5f5}
.lbadge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}

/* ── DRAGGABLE STOP LIST SHEET ── */
#list-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--navy-d);border-radius:16px 16px 0 0;box-shadow:0 -4px 28px rgba(0,0,0,.4);z-index:20;display:flex;flex-direction:column;will-change:transform;/* height + transform set by JS */}
#list-handle{padding:10px 0 5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none}
.lh-bar{width:40px;height:4px;background:rgba(245,230,200,.22);border-radius:2px}
#stoplist{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
#stoplist::-webkit-scrollbar{width:4px}
#stoplist::-webkit-scrollbar-track{background:transparent}
#stoplist::-webkit-scrollbar-thumb{background:rgba(245,230,200,.2);border-radius:2px}
.sl-sec{margin-bottom:2px}
.sl-hdr{display:flex;align-items:center;gap:8px;padding:7px 14px}
.sl-hdr-icon{font-size:13px;line-height:1}
.sl-hdr-label{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;color:#fff;flex:1}
.sl-hdr-count{font-size:11px;font-weight:600;color:rgba(255,255,255,.65);background:rgba(0,0,0,.2);padding:1px 7px;border-radius:10px}
.sl-item{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;transition:background .12s}
.sl-item:active{background:rgba(255,255,255,.08)}
.sl-item:last-child{border-bottom:none}
.sl-item-top{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.sl-num{font-size:11px;font-weight:700;color:var(--terra);min-width:16px;flex-shrink:0}
.sl-item-name{font-size:14px;font-weight:600;color:var(--sand);line-height:1.3}
.sl-item-date{font-size:11px;color:rgba(245,230,200,.5);margin-bottom:2px}
.sl-item-notes{font-size:12px;color:rgba(245,230,200,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.sl-empty{padding:32px 20px;text-align:center;color:rgba(245,230,200,.35);font-size:13px;line-height:1.6}

/* ── OVERLAY + SHEET ── */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;opacity:0;transition:opacity .25s}
#ov.show{display:block;opacity:1}
#sheet{position:fixed;bottom:0;left:0;right:0;background:var(--sand-l);border-radius:20px 20px 0 0;z-index:101;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0);max-height:92dvh;display:flex;flex-direction:column}
#sheet.open{transform:translateY(0)}
@media(min-width:600px){
  #sheet{max-width:480px;left:50%;right:auto;transform:translateX(-50%) translateY(100%)}
  #sheet.open{transform:translateX(-50%) translateY(0)}
}
.handle{width:38px;height:4px;background:#d0c4aa;border-radius:2px;margin:10px auto 0;flex-shrink:0}
.shd{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;flex-shrink:0}
.sht{font-family:'Playfair Display',serif;font-size:20px;color:var(--navy);font-weight:600}
.shx{width:28px;height:28px;border-radius:50%;background:#e5d9c5;border:none;cursor:pointer;font-size:15px;color:var(--navy);display:flex;align-items:center;justify-content:center}
.shb{overflow-y:auto;padding:0 16px 32px;flex:1;-webkit-overflow-scrolling:touch}

/* ── FORM ── */
.fg{margin-bottom:13px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;opacity:.7}
.fi,.fta{width:100%;padding:9px 12px;border:1.5px solid #d5c9b0;border-radius:8px;background:#fff;font-family:'Source Sans 3',sans-serif;font-size:14px;color:var(--navy);outline:none;transition:border-color .15s}
.fi:focus,.fta:focus{border-color:var(--navy)}
.fta{min-height:80px;resize:vertical;line-height:1.5}
.dr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:12px;font-size:12px;font-weight:600;color:#fff;margin-bottom:12px}

/* ── PHOTOS ── */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:5px}
.pthumb{aspect-ratio:1;border-radius:7px;object-fit:cover;width:100%;cursor:pointer;display:block}
.padd{aspect-ratio:1;border-radius:7px;border:2px dashed #d0c4aa;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:26px;color:#c0b090}
.pwrap{position:relative}
.pdel{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:19px;height:19px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}

/* ── BUTTONS ── */
.brow{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:600;transition:opacity .15s}
.btn:active{opacity:.75}
.bp{background:var(--navy);color:var(--sand)}
.bs{background:#e5d9c5;color:var(--navy)}
.bd{background:#fde;color:#b00}
.divider{height:1px;background:#e0d5c0;margin:14px 0}

/* ── VIEW ── */
.vname{font-family:'Playfair Display',serif;font-size:22px;color:var(--navy);margin-bottom:4px}
.vdate{font-size:13px;color:#999;margin-bottom:10px}
.vnotes{font-size:14px;color:#333;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.vcoord{font-size:11px;color:#bbb;margin-top:4px}

/* ── CRUISE MODAL ── */
#cm{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end}
#cm.show{display:flex}
.cmo{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.cmp{position:relative;width:100%;background:var(--sand-l);border-radius:20px 20px 0 0;padding:0 0 16px;max-height:72dvh;display:flex;flex-direction:column;z-index:1}
.cmtop{padding:0 16px 12px;flex-shrink:0}
.cmtitle{font-family:'Playfair Display',serif;font-size:20px;color:var(--navy);text-align:center;padding:14px 0 10px}
.clist{overflow-y:auto;flex:1;padding:0 16px;margin-bottom:10px}
.citem{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff;border:2px solid transparent;transition:border-color .15s}
.citem.act{border-color:var(--navy)}
.cname{font-weight:600;color:var(--navy);font-size:15px}
.cmeta{font-size:12px;color:#aaa;margin-top:1px}
.cdel{background:none;border:none;color:#ccc;font-size:17px;cursor:pointer;padding:4px;line-height:1}
.ncf{display:flex;gap:8px;padding:0 16px}
.nci{flex:1;padding:10px 12px;border:1.5px solid #d5c9b0;border-radius:8px;font-family:'Source Sans 3',sans-serif;font-size:14px;color:var(--navy);outline:none;background:#fff}
.nci:focus{border-color:var(--navy)}
.ncb{padding:10px 16px;background:var(--navy);color:var(--sand);border:none;border-radius:8px;font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:600;cursor:pointer}

/* ── LIGHTBOX ── */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:none;align-items:center;justify-content:center}
#lb.show{display:flex}
#lb img{max-width:96vw;max-height:90dvh;border-radius:8px;object-fit:contain}
#lbx{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18);border:none;color:#fff;font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── EMPTY ── */
.empty{text-align:center;padding:36px 20px;color:#aaa}
.empty h3{font-family:'Playfair Display',serif;font-size:19px;color:var(--navy);margin-bottom:6px}

/* ── SIGN-IN SCREEN ── */
#signin-screen{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.si-box{background:var(--sand-l);border-radius:20px;padding:32px 24px 28px;width:min(360px,100%);text-align:center;box-shadow:0 12px 50px rgba(0,0,0,.45)}
.si-logo{font-size:52px;margin-bottom:8px;line-height:1}
.si-title{font-family:'Playfair Display',serif;font-size:30px;color:var(--navy);margin-bottom:4px;font-weight:700}
.si-sub{font-size:13px;color:#999;margin-bottom:22px;line-height:1.5}
.si-fg{margin-bottom:10px;text-align:left}
.si-fi{width:100%;padding:11px 13px;border:1.5px solid #d5c9b0;border-radius:8px;font-family:'Source Sans 3',sans-serif;font-size:15px;color:var(--navy);background:#fff;outline:none;transition:border-color .15s;-webkit-appearance:none}
.si-fi:focus{border-color:var(--navy)}
.si-primary{width:100%;padding:13px;background:var(--navy);color:var(--sand);border:none;border-radius:10px;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:600;margin-top:4px;transition:opacity .15s}
.si-primary:active{opacity:.8}
.si-err{margin-top:10px;font-size:13px;color:#c0392b;min-height:16px;text-align:left}
.si-switch{margin-top:14px;font-size:13px;color:#888}
.si-switch a{color:var(--navy);font-weight:600;text-decoration:none}
.si-divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:#bbb;font-size:12px}
.si-divider::before,.si-divider::after{content:'';flex:1;height:1px;background:#e0d4bc}
.si-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;background:#fff;border:1.5px solid #e0d8cc;border-radius:10px;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:600;color:#555;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:background .15s}
.si-btn:active{background:#f5f5f5}
/* ── SAVING INDICATOR ── */
#save-dot{width:7px;height:7px;border-radius:50%;background:rgba(245,230,200,.3);flex-shrink:0;transition:background .3s;align-self:center}
#save-dot.saving{background:#f0c040}
/* ── FLEET MODAL ── */
#flt{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end}
#flt.show{display:flex}
/* ── VESSEL ITEMS IN FLEET LIST ── */
.flt-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#fff;border:1.5px solid #e8ddd0;margin-bottom:8px}
.flt-pulse{width:9px;height:9px;border-radius:50%;background:#ddd;flex-shrink:0;transition:background .3s,box-shadow .3s}
.flt-pulse.live{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.22)}
.flt-info{flex:1;min-width:0}
.flt-vname{font-size:14px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flt-mmsi{font-size:11px;color:#aaa;margin-top:1px}
.flt-del{background:none;border:none;color:#ccc;font-size:17px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0}
.flt-del:active{color:#c00}
/* ── REFRESH FLEET BUTTON ── */
#refresh-btn{position:fixed;right:14px;bottom:80px;z-index:19;width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--sand);border:2px solid rgba(245,230,200,.25);cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.4);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Source Sans 3',sans-serif;transition:opacity .2s}
#refresh-btn.vis{display:flex}
#refresh-btn:disabled{opacity:.55;cursor:default}
#refresh-btn .ri{font-size:20px;line-height:1}
#refresh-btn .rc{font-size:9px;line-height:1;opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── LOCATION DOT ── */
.loc-dot{position:absolute;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none}
.loc-dot::before{content:'';position:absolute;inset:0;border-radius:50%;background:#4285f4;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);z-index:1}
.loc-dot::after{content:'';position:absolute;border-radius:50%;background:rgba(66,133,244,.22);animation:loc-pulse 2s ease-out infinite}
@keyframes loc-pulse{0%{inset:0;opacity:1}100%{inset:-14px;opacity:0}}

/* ── USE MY LOCATION BUTTON ── */
.loc-btn{display:flex;align-items:center;gap:7px;width:100%;padding:9px 12px;margin-top:6px;border:1.5px solid #d5c9b0;border-radius:8px;background:#fff;font-family:'Source Sans 3',sans-serif;font-size:13px;color:#555;cursor:pointer;transition:border-color .15s,color .15s,background .15s;text-align:left}
.loc-btn:active{background:#f0f5ff}
.loc-btn:disabled{opacity:.6;cursor:default}
.loc-btn.got{border-color:#4285f4;color:#2a6edb;background:#f0f5ff}
.loc-btn.err{border-color:#d44;color:#b00;background:#fff2f2}

/* ── LAYER BAR ADD BUTTON ── */
.ltog-add{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:2px dashed rgba(245,230,200,.45);cursor:pointer;font-size:20px;line-height:1;color:rgba(245,230,200,.65);background:transparent;font-family:'Source Sans 3',sans-serif;flex-shrink:0;transition:border-color .15s,color .15s;padding:0}
.ltog-add:active{opacity:.7}

/* ── CUSTOM LAYER CREATE MODAL ── */
#cl-modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end}
#cl-modal.show{display:flex}
.cl-swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s,box-shadow .15s;flex-shrink:0}
.cl-swatch.sel{border-color:var(--navy)!important;box-shadow:0 0 0 2px #fff inset}

/* ── PDF PICK MODAL ── */
#pdf-pick{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end}
#pdf-pick.show{display:flex}
.pdf-pick-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ede5d8;cursor:pointer}
.pdf-pick-row:last-child{border-bottom:none}
.pdf-pick-row input[type=checkbox]{width:18px;height:18px;flex-shrink:0;cursor:pointer}
</style>
</head>
<body>

<div id="signin-screen">
  <div class="si-box">
    <div class="si-logo">⚓</div>
    <h1 class="si-title">Sailing Log</h1>
    <p class="si-sub">Your personal cruise journal</p>

    <!-- Email sign-in form (default view) -->
    <div id="si-login">
      <div class="si-fg">
        <input class="si-fi" id="si-email" type="email" placeholder="Email" autocomplete="email" inputmode="email">
      </div>
      <div class="si-fg">
        <input class="si-fi" id="si-pass" type="password" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="si-primary" onclick="emailSignIn()">Sign in</button>
      <div class="si-err" id="si-err"></div>
      <p class="si-switch">No account? <a href="#" onclick="showRegister();return false">Create one</a></p>
    </div>

    <!-- Registration form (hidden by default) -->
    <div id="si-register" style="display:none">
      <div class="si-fg">
        <input class="si-fi" id="si-reg-name" type="text" placeholder="Your name" autocomplete="name">
      </div>
      <div class="si-fg">
        <input class="si-fi" id="si-reg-email" type="email" placeholder="Email" autocomplete="email" inputmode="email">
      </div>
      <div class="si-fg">
        <input class="si-fi" id="si-reg-pass" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password">
      </div>
      <div class="si-fg">
        <input class="si-fi" id="si-reg-pass2" type="password" placeholder="Confirm password" autocomplete="new-password">
      </div>
      <button class="si-primary" onclick="emailRegister()">Create account</button>
      <div class="si-err" id="si-reg-err"></div>
      <p class="si-switch">Already have an account? <a href="#" onclick="showLogin();return false">Sign in</a></p>
    </div>

    <!-- Google as secondary option -->
    <div class="si-divider"><span>or</span></div>
    <button class="si-btn" onclick="signInWithGoogle()">

  startLocationTracking();
  updateRefreshBtn();

function initMap(){
  map = new google.maps.Map(document.getElementById('map'),{
    center:{lat:37.5,lng:25.0},zoom:7,mapTypeId:'terrain',
    disableDefaultUI:true,zoomControl:true,
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},
    gestureHandling:'greedy'
  });
  geocoder = new google.maps.Geocoder();
  const inp = document.getElementById('srch');
  searchBox = new google.maps.places.SearchBox(inp);
  map.addListener('bounds_changed',()=>searchBox.setBounds(map.getBounds()));
  searchBox.addListener('places_changed',()=>{
    const pl = searchBox.getPlaces();
    if(!pl||!pl.length) return;
    const p = pl[0];
    if(!p.geometry) return;
    map.panTo(p.geometry.location);
    map.setZoom(13);
    if(addMode && addLayer){
      const layer=addLayer;
      const lat=p.geometry.location.lat(), lng=p.geometry.location.lng();
      inp.value='';
      setAddMode(false);
      openAddSheet(layer,p.name||'',lat,lng);
    }
  });
  map.addListener('click',e=>{
    if(addMode && addLayer){
      const layer=addLayer;
      setAddMode(false);
      openAddSheet(layer,'',e.latLng.lat(),e.latLng.lng());
    }
  });

  // Long-press: 800 ms, single touch only, cancel if finger moves > 10 px
  const mapEl = document.getElementById('map');
  map.addListener('mousedown', e => {
    clearTimeout(pressTimer); pressTimer = null;
    const dom = e.domEvent;
    // Reject if more than one touch is already down
    if (dom && dom.touches && dom.touches.length !== 1) return;
    const ll = { lat: e.latLng.lat(), lng: e.latLng.lng() };
    const x0 = dom ? (dom.touches ? dom.touches[0].clientX : dom.clientX) : 0;
    const y0 = dom ? (dom.touches ? dom.touches[0].clientY : dom.clientY) : 0;

    pressTimer = setTimeout(() => {
      pressTimer = null;
      pressLL = ll;
      navigator.vibrate && navigator.vibrate(40);
      document.getElementById('lpick').classList.add('show');
      document.getElementById('lpick-bg').classList.add('show');
      cleanup();
    }, 800);

    function onMove(ev) {
      const t = ev.touches ? ev.touches[0] : ev;
      if (!t || Math.hypot(t.clientX - x0, t.clientY - y0) > 10) cancel();
    }
    function onNewTouch(ev) { if (ev.touches.length > 1) cancel(); }
    function cancel() { clearTimeout(pressTimer); pressTimer = null; cleanup(); }
    function cleanup() {
      mapEl.removeEventListener('touchmove',  onMove);
      mapEl.removeEventListener('touchstart', onNewTouch);
      mapEl.removeEventListener('touchend',   cancel);
      mapEl.removeEventListener('touchcancel',cancel);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup',   cancel);
    }
    mapEl.addEventListener('touchmove',   onMove,      { passive: true });
    mapEl.addEventListener('touchstart',  onNewTouch,  { passive: true });
    mapEl.addEventListener('touchend',    cancel,      { passive: true });
    mapEl.addEventListener('touchcancel', cancel,      { passive: true });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   cancel);
  });
  map.addListener('dragstart', () => { clearTimeout(pressTimer); pressTimer = null; });
  mapReady = true;
  if(D) onBothReady(); // data already loaded (auth resolved first)
}

// ── GEOLOCATION ───────────────────────────────────────────────────────────────
function startLocationTracking(){
  if(!navigator.geolocation) return;
  class LocOverlay extends google.maps.OverlayView{
    constructor(pos){super();this.pos=pos;this.el=null;}
    onAdd(){
      this.el=document.createElement('div');
      this.el.className='loc-dot';
      this.getPanes().overlayLayer.appendChild(this.el);
    }
    draw(){
      const p=this.getProjection().fromLatLngToDivPixel(
        new google.maps.LatLng(this.pos.lat,this.pos.lng));
      if(p&&this.el){this.el.style.left=p.x+'px';this.el.style.top=p.y+'px';}
    }
    onRemove(){this.el?.parentNode?.removeChild(this.el);this.el=null;}
    update(pos){this.pos=pos;this.draw();}
  }
  locWatchId=navigator.geolocation.watchPosition(pos=>{
    const ll={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(!locDot){locDot=new LocOverlay(ll);locDot.setMap(map);}
    else locDot.update(ll);
  },null,{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
function crosshairSVG(){
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="flex-shrink:0"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="2" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="22" y2="12"/></svg>`;
}
function useMyLocation(){
  const btn=document.getElementById('btn-loc');
  if(!navigator.geolocation){
    if(btn){btn.innerHTML=crosshairSVG()+' Location unavailable';btn.className='loc-btn err';}
    return;
  }
  if(btn){btn.innerHTML=crosshairSVG()+' Getting location…';btn.disabled=true;btn.className='loc-btn';}
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    pendingPinLL={lat,lng};
    map.panTo({lat,lng});
    if(btn){
      btn.disabled=false;
      btn.innerHTML=crosshairSVG()+' ✓ GPS location set';
      btn.className='loc-btn got';
    }
    // Re-geocode new location; fill name only if still blank
    reverseGeocode(lat,lng,geoName=>{
      const inp=document.getElementById('pname');
      if(inp&&!inp.value&&geoName) inp.value=geoName;
    });
  },()=>{
    if(btn){
      btn.disabled=false;
      btn.innerHTML=crosshairSVG()+' Could not get location';
      btn.className='loc-btn err';
    }
  },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}

// ── MARKERS ──────────────────────────────────────────────────────────────────
function markerSVG(layer, lbl){
  const c = layerCfg(layer).color;
  const t = String(lbl);
  const fs = t.length>1 ? 10 : 13;
  return `data:image/svg+xml;charset=UTF-8,`+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="42">
      <circle cx="17" cy="17" r="15" fill="${c}" stroke="#fff" stroke-width="2.5"/>
      <text x="17" y="17" text-anchor="middle" dominant-baseline="central"
        font-family="sans-serif" font-weight="700" font-size="${fs}" fill="#fff">${t}</text>
      <polygon points="11,30 23,30 17,41" fill="${c}"/>
    </svg>`
  );
}
function mkIcon(layer, lbl){
  return {
    url: markerSVG(layer, lbl),
    scaledSize: new google.maps.Size(34,42),
    anchor: new google.maps.Point(17,41)
  };
}
function placeMarker(pin){
  const ancs = anchorsSorted();
  const lbl = pin.l==='a' ? (ancs.findIndex(p=>p.id===pin.id)+1) : layerCfg(pin.l).letter;
  const mk = new google.maps.Marker({
    position:{lat:pin.lat,lng:pin.lng},
    map: vis[pin.l]?map:null,
    icon: mkIcon(pin.l, lbl),
    title: pin.name,
    optimized:false
  });
  mk.addListener('click',()=>openViewSheet(pin.id));
  MKS[pin.id]=mk;
}
function renderAll(){
  Object.values(MKS).forEach(m=>m.setMap(null));
  MKS={};
  const c=cruise(); if(!c) return;
  Object.values(c.pins).forEach(pin=>placeMarker(pin));
  renderStopList();
}
function reorderAnchors(){
  anchorsSorted().forEach((p,i)=>{
    p.ord=i;
    if(MKS[p.id]) MKS[p.id].setIcon(mkIcon('a',i+1));
  });
}

// ── LAYERS ───────────────────────────────────────────────────────────────────
function toggleL(l){
  vis[l]=!vis[l];
  const btn=document.querySelector(`.ltog[data-l="${l}"]`);
  if(btn){
    btn.classList.toggle('on',vis[l]);
    if(!LC[l]){ // custom layer — colour via inline style
      const cfg=layerCfg(l);
      btn.style.background=vis[l]?cfg.color:'transparent';
      btn.style.color=vis[l]?'#fff':'var(--sand)';
    }
  }
  const c=cruise(); if(!c) return;
  Object.values(c.pins).filter(p=>p.l===l).forEach(p=>{
    if(MKS[p.id]) MKS[p.id].setMap(vis[l]?map:null);
  });
}

// ── REVERSE GEOCODE ───────────────────────────────────────────────────────────
function bestGeoName(results){
  // Prefer locality/island names over street-level detail
  const prefer=['locality','administrative_area_level_3','sublocality_level_1',
                'sublocality','natural_feature','administrative_area_level_2'];
  for(const type of prefer){
    for(const r of results.slice(0,4)){
      const c=r.address_components.find(c=>c.types.includes(type));
      if(c) return c.long_name;
    }
  }
  // Fallback: first component that isn't a number, postal code, or country
  const skip=new Set(['postal_code','country','street_number','political']);
  const fb=results[0]?.address_components.find(c=>!c.types.every(t=>skip.has(t)));
  return fb?.long_name||'';
}
function reverseGeocode(lat,lng,cb){
  if(!geocoder){cb('');return;}
  geocoder.geocode({location:{lat,lng},language:'en'},(results,status)=>{
    cb(status==='OK'&&results.length ? bestGeoName(results) : '');
  });
}

function dataURLtoBlob(d){
  const[h,b]=d.split(',');
  const mime=h.match(/:(.*?);/)[1];
  const bin=atob(b);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function uploadCloudinary(dataURL){
  const fd=new FormData();
  fd.append('file',dataURLtoBlob(dataURL));
  fd.append('upload_preset','sailing_log_unsigned');
  const res=await fetch('https://api.cloudinary.com/v1_1/dyqrghoj3/image/upload',{method:'POST',body:fd});
  const json=await res.json();
  if(!json.secure_url) throw new Error('Upload failed');
  return json.secure_url;
}
function onPhotoFile(inp){
  Array.from(inp.files).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>compress(e.target.result,1200,async dataURL=>{
      const slot=pendingPhotos.length;
      pendingPhotos.push(null); // placeholder while uploading
      viewPhotos=pendingPhotos;
      renderPGrid();
      try{
        pendingPhotos[slot]=await uploadCloudinary(dataURL);
      }catch(err){
        pendingPhotos.splice(slot,1);
        alert('Photo upload failed — please try again.');
      }
      viewPhotos=pendingPhotos;
      renderPGrid();
    });
    r.readAsDataURL(f);
  });
  inp.value='';
}
function compress(src, maxPx, cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>maxPx||h>maxPx){if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
    const cv=document.createElement('canvas');
    cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',.72));
  };
  img.src=src;
}

async function exportPDF(selected){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const c=cruise();
  const pins=Object.values(c.pins);
  const W=210,H=297,ML=16,MR=16,MT=16,CW=W-ML-MR;

  // Palette
  const NAVY=[26,39,68],SAND=[245,230,200],SAND_L=[253,246,234];
  const GREY=[148,140,130],WHITE=[255,255,255],DIV=[215,205,190];
  const LRGB={a:[193,68,14],r:[107,124,62],c:[46,109,164],h:[139,105,20]};
  function getRGB(l){ return LRGB[l]||hexRGB(layerCfg(l).color); }

  // ── HELPERS ──────────────────────────────────────────────────────────────────
  function dateRange(){
    const ds=pins.filter(p=>p.ds).map(p=>p.ds).sort();
    const de=pins.filter(p=>p.de).map(p=>p.de).sort();
    if(!ds.length) return '';
    const end=de.length?de[de.length-1]:ds[ds.length-1];
    return ds[0]===end?fd(ds[0]):`${fd(ds[0])} – ${fd(end)}`;
  }

  // Mercator helpers — project lat/lng to pixel coords at a given zoom
  function mercY(lat){
    const s=Math.sin(lat*Math.PI/180);
    return 0.5-Math.log((1+s)/(1-s))/(4*Math.PI);
  }
  function worldPx(lat,lng,zoom){
    const sc=256*Math.pow(2,zoom);
    return{x:(lng+180)/360*sc, y:mercY(lat)*sc};
  }
  // Find center+zoom so all pins fit inside imgW×imgH with pad pixels of margin
  function calcView(allPins,imgW,imgH,pad){
    if(!allPins.length) return{cLat:37.5,cLng:25,zoom:7};
    if(allPins.length===1) return{cLat:allPins[0].lat,cLng:allPins[0].lng,zoom:10};
    const lats=allPins.map(p=>p.lat),lngs=allPins.map(p=>p.lng);
    const cLat=(Math.min(...lats)+Math.max(...lats))/2;
    const cLng=(Math.min(...lngs)+Math.max(...lngs))/2;
    let zoom=13;
    while(zoom>1){
      const cPx=worldPx(cLat,cLng,zoom);
      const ok=allPins.every(p=>{
        const px=worldPx(p.lat,p.lng,zoom);
        return Math.abs(px.x-cPx.x)<=imgW/2-pad && Math.abs(px.y-cPx.y)<=imgH/2-pad;
      });
      if(ok) break;
      zoom--;
    }
    return{cLat,cLng,zoom};
  }
  function coverMapUrl(cLat,cLng,zoom){
    return `https://maps.googleapis.com/maps/api/staticmap?size=640x400&maptype=terrain&center=${cLat},${cLng}&zoom=${zoom}&key=${GKEY}`;
  }

  function lighten(rgb,amt){
    return rgb.map(v=>Math.min(255,v+amt));
  }

  // ── COVER PAGE ───────────────────────────────────────────────────────────────
  doc.setFillColor(...SAND_L);
  doc.rect(0,0,W,H,'F');

  // Navy header band
  doc.setFillColor(...NAVY);
  doc.rect(0,0,W,54,'F');

  // Cruise name
  doc.setFont('helvetica','bold');
  doc.setFontSize(30);
  doc.setTextColor(...SAND);
  doc.text(c.name,W/2,27,{align:'center'});

  // Date range
  const dr=dateRange();
  if(dr){
    doc.setFont('helvetica','normal');
    doc.setFontSize(11);
    doc.setTextColor(205,192,168);
    doc.text(dr,W/2,39,{align:'center'});
  }

  // Sub-label
  doc.setFont('helvetica','normal');
  doc.setFontSize(7);
  doc.setTextColor(148,135,112);
  doc.text('SAILING JOURNAL',W/2,49,{align:'center'});

  // Map
  const IMG_W=640,IMG_H=400,PAD_PX=35;
  const selPins=pins.filter(p=>selected.has(p.l));
  const {cLat,cLng,zoom:mapZoom}=calcView(selPins,IMG_W,IMG_H,PAD_PX);
  const mapX=ML,mapY=62,mapW=CW,mapH=Math.round(CW*IMG_H/IMG_W); // ≈111mm
  try{
    const img=await imgToDataURL(coverMapUrl(cLat,cLng,mapZoom));
    doc.addImage(img,'JPEG',mapX,mapY,mapW,mapH);
    doc.setDrawColor(...DIV);
    doc.setLineWidth(0.3);
    doc.rect(mapX,mapY,mapW,mapH);

    // Overlay labeled markers drawn with jsPDF (no single-char API limitation)
    const scX=mapW/IMG_W, scY=mapH/IMG_H;
    const cPx=worldPx(cLat,cLng,mapZoom);
    const layerPins={};
    for(const l of selected){ layerPins[l]=l==='a'?anchorsSorted():pins.filter(p=>p.l===l); }
    for(const l of selected){
      (layerPins[l]||[]).forEach((p,i)=>{
        const px=worldPx(p.lat,p.lng,mapZoom);
        const ix=IMG_W/2+(px.x-cPx.x);
        const iy=IMG_H/2+(px.y-cPx.y);
        if(ix<3||ix>IMG_W-3||iy<3||iy>IMG_H-3) return;
        const mx=mapX+ix*scX;
        const my=mapY+iy*scY;
        const lbl=l==='a'?String(i+1):(layerCfg(l).letter+String(i+1));
        const r=3.2;
        doc.setFillColor(...getRGB(l));
        doc.circle(mx,my,r,'F');
        doc.setDrawColor(...WHITE);
        doc.setLineWidth(0.3);
        doc.circle(mx,my,r,'S');
        doc.setFont('helvetica','bold');
        doc.setFontSize(lbl.length>2?4:lbl.length===2?5.5:7);
        doc.setTextColor(...WHITE);
        doc.text(lbl,mx,my+0.7,{align:'center'});
      });
    }
  }catch(e){
    doc.setFillColor(200,210,218);
    doc.rect(mapX,mapY,mapW,mapH,'F');
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.setTextColor(110,120,130);
    doc.text('Map unavailable',W/2,mapY+mapH/2,{align:'center'});
  }

  // Legend
  const lgY=mapY+mapH+10;
  doc.setFont('helvetica','bold');
  doc.setFontSize(7);
  doc.setTextColor(...GREY);
  doc.text('STOPS BY CATEGORY',ML,lgY);

  const lkeys=[...selected];
  const perRow=Math.min(lkeys.length,4);
  if(perRow>0){
    const bw=(CW-(perRow-1)*4)/perRow;
    lkeys.forEach((l,i)=>{
      const rgb=getRGB(l);
      const cnt=l==='a'?anchorsSorted().length:pins.filter(p=>p.l===l).length;
      const row=Math.floor(i/perRow), col=i%perRow;
      const bx=ML+col*(bw+4), by=lgY+5+row*30;
      doc.setFillColor(...rgb);
      doc.roundedRect(bx,by,bw,16,2,2,'F');
      doc.setFont('helvetica','bold');
      doc.setFontSize(17);
      doc.setTextColor(...WHITE);
      doc.text(String(cnt),bx+bw/2,by+11,{align:'center'});
      doc.setFont('helvetica','normal');
      doc.setFontSize(7);
      doc.setTextColor(...NAVY);
      doc.text(layerCfg(l).label,bx+bw/2,by+22,{align:'center'});
    });
  }

  // ── STOP PAGES ───────────────────────────────────────────────────────────────
  let pageNum=0;
  let y=0;
  const BOTTOM=H-20; // content zone ends here; footer occupies H-20 to H

  function drawFooter(){
    doc.setDrawColor(...DIV);
    doc.setLineWidth(0.2);
    doc.line(ML,H-14,W-MR,H-14);
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.5);
    doc.setTextColor(...GREY);
    doc.text(c.name,ML,H-9);
    doc.text(String(pageNum),W-MR,H-9,{align:'right'});
  }

  function newPage(){
    if(pageNum>0) drawFooter();
    doc.addPage();
    pageNum++;
    doc.setFillColor(...SAND_L);
    doc.rect(0,0,W,H,'F');
    y=MT;
  }

  // Height a stop will occupy (measured before drawing)
  function stopH(pin){
    let h=8; // name/date row
    if(pin.notes){
      const lines=doc.splitTextToSize(pin.notes,CW-12);
      h+=Math.min(lines.length,5)*4.5+2;
    }
    return h+5; // +5 for divider gap
  }

  // Draw one stop at the current y, advancing y
  function drawStop(pin,idx,l,isLast){
    const rgb=getRGB(l);
    const lbl=l==='a'?String(idx+1):(layerCfg(l).letter+String(idx+1));
    const dotX=ML+4.5, dotY=y+4;

    // Coloured dot badge
    doc.setFillColor(...rgb);
    doc.circle(dotX,dotY,3.5,'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(lbl.length>2?4.5:lbl.length>1?5.5:7);
    doc.setTextColor(...WHITE);
    doc.text(lbl,dotX,dotY+0.7,{align:'center'});

    // Name (bold, navy)
    const tx=ML+11;
    const ds=pin.ds?(pin.de&&pin.de!==pin.ds?`${fd(pin.ds)} – ${fd(pin.de)}`:fd(pin.ds)):'';
    doc.setFont('helvetica','bold');
    doc.setFontSize(10);
    doc.setTextColor(...NAVY);
    doc.text(pin.name,tx,y+5.5,{maxWidth:ds?CW-50:CW-14});

    // Date (grey, right-aligned, same baseline)
    if(ds){
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(...GREY);
      doc.text(ds,W-MR,y+5.5,{align:'right'});
    }
    y+=8;

    // Notes (smaller, dark)
    if(pin.notes){
      const lines=doc.splitTextToSize(pin.notes,CW-12);
      const shown=lines.slice(0,5);
      doc.setFont('helvetica','normal');
      doc.setFontSize(8.5);
      doc.setTextColor(70,65,58);
      shown.forEach(ln=>{doc.text(ln,tx,y);y+=4.5;});
      if(lines.length>5){doc.setTextColor(...GREY);doc.text('…',tx,y);}
      y+=2;
    }

    // Thin divider between stops
    if(!isLast){
      doc.setDrawColor(...DIV);
      doc.setLineWidth(0.2);
      doc.line(ML+8,y+1,W-MR,y+1);
      y+=5;
    } else {
      y+=4;
    }
  }

  // Iterate layer groups
  for(const l of selected){
    const lPins=l==='a'?anchorsSorted():pins.filter(p=>p.l===l);
    if(!lPins.length) continue;
    const rgb=getRGB(l);

    // Open a content page (first time, or if header+first stop won't fit)
    if(pageNum===0){
      newPage();
    } else if(y+9+stopH(lPins[0])>BOTTOM){
      newPage();
    }

    // Layer header bar
    doc.setFillColor(...rgb);
    doc.rect(ML,y,CW,8,'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    doc.setTextColor(...WHITE);
    doc.text(layerCfg(l).label.toUpperCase(),ML+5,y+5.5);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.text(`${lPins.length} stop${lPins.length!==1?'s':''}`,W-MR-2,y+5.5,{align:'right'});
    y+=11;

    // Stops
    for(let i=0;i<lPins.length;i++){
      const pin=lPins[i];
      if(y+stopH(pin)>BOTTOM){
        newPage();
        // Lighter continuation bar
        doc.setFillColor(...lighten(rgb,45));
        doc.rect(ML,y,CW,5,'F');
        doc.setFont('helvetica','bold');
        doc.setFontSize(7);
        doc.setTextColor(...WHITE);
        doc.text(layerCfg(l).label.toUpperCase()+' (cont.)',ML+4,y+3.5);
        y+=8;
      }
      drawStop(pin,i,l,i===lPins.length-1);
    }
    y+=3; // gap between groups
  }

  if(pageNum>0) drawFooter();
  doc.save(`${c.name.replace(/\s+/g,'-')}-journal.pdf`);
}
async function imgToDataURL(url){
  const r=await fetch(url);
  const b=await r.blob();
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>res(rd.result);
    rd.onerror=rej;
    rd.readAsDataURL(b);
  });
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fd(d){
  if(!d) return '';
  const [y,m,dy]=d.split('-');
  return new Date(+y,+m-1,+dy).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function hexRGB(h){
  return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
}

// ── DRAGGABLE LIST SHEET ──────────────────────────────────────────────────────
function initListSheet(){
  const sheet=document.getElementById('list-sheet');
  const handle=document.getElementById('list-handle');
  if(!sheet||!handle) return;

  let sheetY=0;

  function sheetH(){ return window.innerHeight-document.getElementById('hdr').offsetHeight; }
  function snaps(h){ return [0, Math.round(h*.46), h-60]; }
  function nearest(y,h){ return snaps(h).reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a); }

  function setY(y,animate){
    sheet.style.transition=animate?'transform .32s cubic-bezier(.4,0,.2,1)':'none';
    sheet.style.transform=`translateY(${y}px)`;
    sheetY=y;
  }
  function resize(){
    const h=sheetH();
    sheet.style.height=h+'px';
    // Keep proportional snap on resize; default to collapsed
    setY(h-60,false);
  }
  resize();
  window.addEventListener('resize',resize);

  // ── Touch drag ──
  let t0=0,sy0=0;
  handle.addEventListener('touchstart',e=>{
    t0=e.touches[0].clientY; sy0=sheetY;
    sheet.style.transition='none';
  },{passive:true});
  handle.addEventListener('touchmove',e=>{
    const h=sheetH();
    const ny=Math.max(0,Math.min(h-60, sy0+(e.touches[0].clientY-t0)));
    sheet.style.transform=`translateY(${ny}px)`;
    sheetY=ny;
  },{passive:true});
  handle.addEventListener('touchend',  ()=>setY(nearest(sheetY,sheetH()),true));
  handle.addEventListener('touchcancel',()=>setY(nearest(sheetY,sheetH()),true));

  // ── Mouse drag ──
  handle.addEventListener('mousedown',e=>{
    t0=e.clientY; sy0=sheetY;
    sheet.style.transition='none';
    const onMove=ev=>{
      const h=sheetH();
      const ny=Math.max(0,Math.min(h-60, sy0+(ev.clientY-t0)));
      sheet.style.transform=`translateY(${ny}px)`;
      sheetY=ny;
    };
    const onUp=()=>{
      setY(nearest(sheetY,sheetH()),true);
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
    };
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    e.preventDefault();
  });
}
initListSheet();

// ── FLEET MANAGEMENT ─────────────────────────────────────────────────────────
function fleet(){ return D.fleet||(D.fleet=[]); }

function openFleet(){
  renderFleetList();
  document.getElementById('flt').classList.add('show');
  fetchVFStatus();
}
async function fetchVFStatus(){
  const el=document.getElementById('flt-credits');
  el.textContent='Loading credits…';
  try{
    const res=await fetch('/.netlify/functions/vessel-status');
    const data=await res.json();
    if(data.error){el.textContent='Credits: unavailable';return;}
    // VesselFinder status response fields (flexible parsing)
    const credits=data.credits??data.Credits??data.remaining??data.Remaining??null;
    const expRaw=data.expiration??data.Expiration??data.expires??data.Expires??data.exp??null;
    let expStr='';
    if(expRaw){
      const d=new Date(expRaw);
      if(!isNaN(d)) expStr=' — expires '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    }
    el.textContent=credits!=null?`Credits: ${Number(credits).toLocaleString()} remaining${expStr}`:'Credits: unavailable';
  }catch(err){
    el.textContent='Credits: unavailable';
    console.error('[VF status]',err);
  }
}
function closeFleet(){
  document.getElementById('flt').classList.remove('show');
  document.getElementById('fi-name').value='';
  document.getElementById('fi-mmsi').value='';
  document.getElementById('flt-err').textContent='';
}
function renderFleetList(){
  const f=fleet();
  const el=document.getElementById('flt-list');
  el.innerHTML=f.length ? f.map(v=>{
    const live=VPos[v.mmsi]&&(Date.now()-VPos[v.mmsi].ts<300000);
    return `<div class="flt-item">
      <div class="flt-pulse${live?' live':''}" id="fpulse-${v.mmsi}"></div>
      <div class="flt-info">
        <div class="flt-vname">${esc(v.name)}</div>
        <div class="flt-mmsi">MMSI ${v.mmsi}</div>
      </div>
      <button class="flt-del" onclick="removeVessel('${v.mmsi}')">✕</button>
    </div>`;
  }).join('') : '<div style="text-align:center;color:#aaa;font-size:13px;padding:14px 0">No vessels added yet.</div>';
  const n=f.length;
  document.getElementById('flt-count').textContent=n?`${n}/20 vessels`:'';
}
function addVessel(){
  const name=document.getElementById('fi-name').value.trim();
  const mmsi=document.getElementById('fi-mmsi').value.trim();
  const err=document.getElementById('flt-err');
  err.textContent='';
  if(!name){err.textContent='Please enter a vessel name.';return;}
  if(!/^\d{9}$/.test(mmsi)){err.textContent='MMSI must be exactly 9 digits.';return;}
  const f=fleet();
  if(f.length>=20){err.textContent='Maximum 20 vessels reached.';return;}
  if(f.find(v=>v.mmsi===mmsi)){err.textContent='That MMSI is already in your fleet.';return;}
  f.push({name,mmsi});
  save();
  document.getElementById('fi-name').value='';
  document.getElementById('fi-mmsi').value='';
  renderFleetList();
  updateRefreshBtn();
}
function removeVessel(mmsi){
  D.fleet=fleet().filter(v=>v.mmsi!==mmsi);
  save();
  clearVesselMarker(mmsi);
  renderFleetList();
  updateRefreshBtn();
}

// ── VESSEL MARKERS ────────────────────────────────────────────────────────────
function vesselSVG(name, cog, ts){
  const angle=(cog!=null&&cog>=0&&cog<=360)?Math.round(cog):0;
  const label=name.length>15?name.slice(0,15)+'…':name;
  const safe=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const timeLabel=ts?timeSince(ts):'';
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="90" height="62" overflow="visible">
      <g transform="translate(45,20) rotate(${angle})">
        <!-- Hull: top-down sailboat silhouette, bow pointing up -->
        <path d="M0,-13 C3,-10 5,-2 5,6 L3,11 L0,14 L-3,11 L-5,6 C-5,-2 -3,-10 0,-13Z"
              fill="#1a7fd4" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Mast (white circle viewed from above) -->
        <circle cx="0" cy="-3" r="1.4" fill="#fff"/>
        <!-- Boom (thin line extending from mast toward port-stern, suggests sail) -->
        <line x1="0" y1="-3" x2="-4" y2="7" stroke="#fff" stroke-width="1.1"
              stroke-linecap="round" opacity="0.65"/>
      </g>
      <text x="45" y="42" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700"
        fill="#1a2744" stroke="#fff" stroke-width="3" paint-order="stroke">${safe(label)}</text>
      ${timeLabel?`<text x="45" y="53" text-anchor="middle" font-family="sans-serif" font-size="9"
        fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">${safe(timeLabel)}</text>`:''}
    </svg>`
  );
}
function placeVesselMarker(mmsi, lat, lng, cog){
  const v=fleet().find(x=>x.mmsi===mmsi);
  if(!v||!map) return;
  const icon={url:vesselSVG(v.name,cog,VPos[mmsi]?.ts),scaledSize:new google.maps.Size(90,62),anchor:new google.maps.Point(45,20)};
  if(VKS[mmsi]){
    VKS[mmsi].setPosition({lat,lng});
    VKS[mmsi].setIcon(icon);
  } else {
    const mk=new google.maps.Marker({position:{lat,lng},map,icon,title:v.name,zIndex:9});
    mk.addListener('click',()=>openVesselSheet(mmsi));
    VKS[mmsi]=mk;
  }
}
function clearVesselMarker(mmsi){
  if(VKS[mmsi]){VKS[mmsi].setMap(null);delete VKS[mmsi];}
  delete VPos[mmsi];
}
function openVesselSheet(mmsi){
  const v=fleet().find(x=>x.mmsi===mmsi); if(!v) return;
  const p=VPos[mmsi];
  const sog=p?.sog!=null?`${parseFloat(p.sog).toFixed(1)} kn`:'—';
  const cog=p?.cog!=null?`${Math.round(p.cog)}°`:'—';
  const ago=p?.ts?timeSince(p.ts):'No data yet';
  openSheet(v.name,`
    <div class="badge" style="background:#1a7fd4">⛵ Vessel</div>
    <div class="vname">${esc(v.name)}</div>
    <div class="vdate" style="color:#aaa">MMSI: ${v.mmsi}</div>
    ${p?`<div class="divider"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div><div style="font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Speed</div>
           <div style="font-size:20px;font-weight:700;color:var(--navy);font-family:'Playfair Display',serif">${sog}</div></div>
      <div><div style="font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Course</div>
           <div style="font-size:20px;font-weight:700;color:var(--navy);font-family:'Playfair Display',serif">${cog}</div></div>
    </div>
    <div style="font-size:12px;color:#aaa">Updated ${ago}</div>`
    :'<div style="color:#aaa;font-size:14px;margin-top:12px">Waiting for position report…</div>'}
    <div class="brow" style="margin-top:20px"><button class="btn bs" onclick="closeSheet()">Close</button></div>`);
}
function timeSince(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago';
}

// ── AIS WEBSOCKET ─────────────────────────────────────────────────────────────
// ── VESSEL FINDER REFRESH ─────────────────────────────────────────────────────
const VF_COOLDOWN = 300; // seconds (5 min)

function updateRefreshBtn(){
  const btn=document.getElementById('refresh-btn');
  if(!btn) return;
  const hasFleet=D?.fleet?.length>0;
  btn.classList.toggle('vis', hasFleet);
}

async function refreshFleet(){
  const f=fleet();
  if(!f.length) return;
  const btn=document.getElementById('refresh-btn');
  btn.disabled=true;
  btn.innerHTML='<span class="ri" style="font-size:14px;animation:spin .8s linear infinite">⟳</span>';

  const mmsis=f.map(v=>v.mmsi).join(',');
  console.log('[VF] Fetching positions for MMSIs:',mmsis);
  try{
    const res=await fetch(`/.netlify/functions/vessel-positions?mmsi=${encodeURIComponent(mmsis)}`);
    const raw=await res.text();
    console.log('[VF] Raw response:',raw);
    if(!res.ok) throw new Error(`HTTP ${res.status}: ${raw.slice(0,200)}`);
    const data=JSON.parse(raw);
    console.log('[VF] Parsed response:',data);

    const vessels=Array.isArray(data)?data:[data];
    let updated=0;
    vessels.forEach(item=>{
      const ais=item.AIS||item;
      const mmsi=String(ais.MMSI||ais.mmsi||'');
      const lat=parseFloat(ais.LATITUDE??ais.LAT??ais.lat??0);
      const lng=parseFloat(ais.LONGITUDE??ais.LON??ais.lng??0);
      const cog=parseFloat(ais.COG??ais.cog??0);
      const sog=parseFloat(ais.SOG??ais.sog??0);
      if(!mmsi||(!lat&&!lng)) return;
      VPos[mmsi]={lat,lng,cog,sog,ts:Date.now()};
      placeVesselMarker(mmsi,lat,lng,cog);
      const dot=document.getElementById('fpulse-'+mmsi);
      if(dot) dot.classList.add('live');
      updated++;
    });
    console.log(`[VF] Updated ${updated}/${f.length} vessel(s)`);
    startVFCooldown();
  }catch(err){
    console.error('[VF] Error:',err);
    btn.disabled=false;
    btn.innerHTML='<span class="ri">⟳</span>';
    alert('Could not fetch vessel positions:\n'+err.message);
  }
}

function startVFCooldown(){
  clearInterval(vfCooldownTick);
  vfCooldownEnd=Date.now()+VF_COOLDOWN*1000;
  const btn=document.getElementById('refresh-btn');
  btn.disabled=true;
  function tick(){
    const rem=Math.ceil((vfCooldownEnd-Date.now())/1000);
    if(rem<=0){
      clearInterval(vfCooldownTick);
      btn.disabled=false;
      btn.innerHTML='<span class="ri">⟳</span>';
      return;
    }
    const m=Math.floor(rem/60), s=String(rem%60).padStart(2,'0');
    btn.innerHTML=`<span class="ri" style="font-size:16px">⟳</span><span class="rc">${m}:${s}</span>`;
  }
  tick();
  vfCooldownTick=setInterval(tick,1000);
}

// ── AUTH STATE ────────────────────────────────────────────────────────────────
auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser=user;
    await loadData();
    const first=(user.displayName||'').split(' ')[0]||'My Log';
    document.getElementById('user-name').textContent=first;
    document.getElementById('signin-screen').style.display='none';
    if(mapReady) onBothReady(); // map was ready first; render now
  } else {
    currentUser=null;
    D=null;
    Object.values(MKS).forEach(m=>m.setMap(null));
    MKS={};
    Object.keys(VKS).forEach(clearVesselMarker);
    updateRefreshBtn();
    document.getElementById('stoplist').innerHTML='';
    document.getElementById('user-name').textContent='';
    document.getElementById('signin-screen').style.display='flex';
  }
});
